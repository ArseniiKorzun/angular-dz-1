<section class="recipe">
  <h2>Рецепт: {{ name }}</h2>
  <img [src]="photo" [alt]="name" />

  <h3>Інгредієнти</h3>
  <ul>
    @for (item of ingredients; track item.name) {
      <li>{{ item.name }} — <strong>{{ item.amount }}</strong></li>
    }
  </ul>

  <h3>Приготування</h3>
  <ol>
    @for (step of steps; track step) {
      <li>{{ step }}</li>
    }
  </ol>
</section>
